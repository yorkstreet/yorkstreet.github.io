<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media — Digital Signage</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.cloudinary.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src *; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.cloudinary.com https://*.gstatic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com; img-src 'self' https://*.cloudinary.com data:;">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">Digital Signage</div>
    <nav>
      <a href="dashboard.html"><span>Dashboard</span></a>
      <a href="media.html" class="active"><span>Media</span></a>
      <a href="presentations.html"><span>Presentations</span></a>
      <a href="monitors.html"><span>Monitors</span></a>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-footer">
      <button id="logout-btn"><span>Logout</span></button>
    </div>
  </aside>
  <main class="admin-main">
    <h1>Media Library</h1>
    <div id="status-area"></div>
    <div class="card">
      <div class="card-header">Upload New Media</div>
      <p style="font-size:14px;color:var(--color-text-secondary);margin-bottom:12px;">Upload images and videos to Cloudinary. They will appear here and can be added to presentations.</p>
      <button class="btn btn-primary" id="btn-upload">Upload Media</button>
    </div>
    <div class="card">
      <div class="card-header">All Media</div>
      <div id="media-grid-area">
        <div class="empty-state"><div class="spinner"></div><p>Loading media...</p></div>
      </div>
    </div>
  </main>
</div>

<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../js/config.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/admin-media.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  requireAdminAuth();
  setupLogoutButton();
  loadMedia();
  
  var btnUpload = document.getElementById('btn-upload');
  if (btnUpload) {
    btnUpload.addEventListener('click', openUploadWidget);
  }
});
</script>
</body>
</html>
