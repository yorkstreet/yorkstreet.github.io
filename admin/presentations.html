<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentations — Digital Signage</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📽️</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://*.firebaseio.com https://*.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src *; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com; img-src 'self' data:;">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">Digital Signage</div>
    <nav>
      <a href="dashboard.html"><span>Dashboard</span></a>
      <a href="media.html"><span>Media</span></a>
      <a href="presentations.html" class="active"><span>Presentations</span></a>
      <a href="monitors.html"><span>Monitors</span></a>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-footer">
      <button id="logout-btn"><span>Logout</span></button>
    </div>
  </aside>
  <main class="admin-main">
    <h1>Presentations</h1>
    <div id="status-area"></div>

    <div class="card">
      <div class="card-header">Create New Presentation</div>
      <form id="create-pres-form">
        <div class="form-group">
          <label for="new-pres-name">Presentation Name</label>
          <input type="text" id="new-pres-name" placeholder="e.g. Lobby Slideshow" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-header">All Presentations</div>
      <div id="pres-list-area">
        <div class="empty-state"><div class="spinner"></div><p>Loading...</p></div>
      </div>
    </div>

    <div id="edit-modal" class="modal-overlay" style="display:none">
      <div class="modal" style="max-width:600px">
        <h2 id="edit-modal-title">Edit Presentation</h2>
        <div id="edit-status"></div>
        <input type="hidden" id="edit-pres-id">
        <div class="form-group">
          <label for="edit-pres-name">Name</label>
          <input type="text" id="edit-pres-name">
        </div>
        <div class="form-group">
          <label>Slides</label>
          <div id="edit-slides-list" class="slide-list"></div>
          <div class="add-slide-bar">
            <button type="button" class="btn btn-outline btn-sm" id="btn-add-image">+ Add Image</button>
            <button type="button" class="btn btn-outline btn-sm" id="btn-add-video">+ Add Video</button>
            <button type="button" class="btn btn-outline btn-sm" id="btn-add-embed">+ Add Embed</button>
          </div>
        </div>
        <div class="form-group">
          <label class="checkbox-label" style="display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;color:var(--color-text-secondary);">
            <input type="checkbox" id="edit-is-default"> Set as default for new monitors
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-primary" id="btn-save-pres">Save</button>
          <button type="button" class="btn btn-outline" id="btn-cancel-edit">Cancel</button>
          <button type="button" class="btn btn-danger" id="btn-delete-pres" style="margin-left:auto;">Delete</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../js/config.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/admin-presentations.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  requireAdminAuth();
  setupLogoutButton();
  loadPresentations();
  
  var createForm = document.getElementById('create-pres-form');
  if (createForm) {
    createForm.addEventListener('submit', createPresentation);
  }
  
  var btnAddImage = document.getElementById('btn-add-image');
  if (btnAddImage) {
    btnAddImage.addEventListener('click', addImageSlide);
  }
  
  var btnAddVideo = document.getElementById('btn-add-video');
  if (btnAddVideo) {
    btnAddVideo.addEventListener('click', addVideoSlide);
  }
  
  var btnAddEmbed = document.getElementById('btn-add-embed');
  if (btnAddEmbed) {
    btnAddEmbed.addEventListener('click', addEmbedSlide);
  }
  
  var btnSavePres = document.getElementById('btn-save-pres');
  if (btnSavePres) {
    btnSavePres.addEventListener('click', savePresentation);
  }
  
  var btnCancelEdit = document.getElementById('btn-cancel-edit');
  if (btnCancelEdit) {
    btnCancelEdit.addEventListener('click', closeEditModal);
  }
  
  var btnDeletePres = document.getElementById('btn-delete-pres');
  if (btnDeletePres) {
    btnDeletePres.addEventListener('click', deletePresentation);
  }
});
</script>
</body>
</html>
